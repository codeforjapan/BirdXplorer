name: Project test
on: workflow_call

permissions:
  contents: read
  packages: read

jobs:
  common-test-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: birdxplorer
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: common/pyproject.toml
      - name: dependency install
        run: pip install -e "./common[dev]"
      - name: copy env
        run: cp .env.example common/.env
      - name: test
        working-directory: common
        run: tox

  api-test-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: dependency install
        run: pip install -e "./api[dev]"
      - name: copy env
        run: cp .env.example api/.env
      - name: test
        working-directory: api
        run: tox

  etl-test-check:
    runs-on: ubuntu-latest
    # 実 PostgreSQL を使うテスト(*_pg.py)は BX_TEST_DB_URL が無いと skip される。
    # 差分ゲートの「同値なら書かない」や NULL の扱いは MagicMock では一切検証できず、
    # サービスを立てないと最も価値の高いテストが常に緑のまま素通りする。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: birdxplorer
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: etl/pyproject.toml
      - name: dependency install
        run: pip install -e "./common" -e "./etl[dev]"
      - name: copy env
        run: cp .env.example etl/.env
      - name: test
        working-directory: etl
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          X_EMAIL: ${{ secrets.X_EMAIL }}
          X_EMAIL_PASSWORD: ${{ secrets.X_EMAIL_PASSWORD }}
          BX_TEST_DB_URL: postgresql://postgres:birdxplorer@localhost:5433/postgres
        run: pytest
