[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.8.0,<4"]


[project]
name = "birdxplorer_api"
description = "The Web API for BirdXplorer project."
authors = [
    {name = "osoken"},
]
dynamic = [
    "version",
]
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "fastapi",
    "python-dateutil",
    "pydantic",
    "starlette",
    "python-dotenv",
    "uvicorn[standard]",
    "openai",
    "opensearch-py",
    "boto3",
]

[project.urls]
Source = "https://github.com/codeforjapan/BirdXplorer"

[tool.setuptools]
packages=["birdxplorer_api"]

[tool.setuptools.package-data]
birdxplorer_api = ["py.typed"]

[project.optional-dependencies]
dev=[
    "black",
    "flake8",
    "pyproject-flake8",
    "pytest",
    "mypy",
    "tox",
    "isort",
    "pytest-mock",
    "pytest-cov",
    "freezegun",
    "types-python-dateutil",
    "psycopg2-binary",
    "factory_boy",
    "polyfactory",
    "httpx2",
]
prod=[
    # cache-bust 2026-07-21: force Docker pip-layer rebuild to pull common@main
    # (engagement-sort enum/storage in common; see Issue #131 / PR #267)
    "birdxplorer_common @ git+https://github.com/codeforjapan/BirdXplorer.git@main#subdirectory=common",
    "psycopg2",
    "gunicorn",
]

[tool.pytest.ini_options]
addopts = ["-sv", "--doctest-modules", "--ignore-glob=birdxplorer_api/main.py", "--cov=birdxplorer_api", "--cov-report=xml", "--cov-report=term-missing"]
testpaths = ["tests", "birdxplorer_api"]
filterwarnings = [
    "error",
    "ignore:The \\'app\\' shortcut is now deprecated. Use the explicit style \\'transport=WSGITransport\\(app=\\.\\.\\.\\)\\' instead\\.",
    # starlette の testclient が anyio.abc.* の旧別名を参照しており、新しい anyio が
    # その別名に DeprecationWarning を付けたため、依存を更新するだけで "error" に
    # 引っかかって conftest の import 時点で collection error になる。
    # 実際に警告を出すのは testclient.py:53 のみ(379/422 は from __future__ import
    # annotations 下の注釈なので評価されない)。こちらのコードでは制御できない。
    #
    # 別名を1つに絞らず anyio.abc.* をまとめて対象にしているのは、starlette が別の別名を
    # 触ったときに同じ失敗を繰り返さないため。メッセージは anyio の
    # _lazyimport.emit_deprecation_warning だけが生成するので、範囲は限定的。
    #
    # 契機: anyio 4.15.0 (2026-09-02) の遅延 import 化 (agronholm/anyio#1169)
    # 上流 issue: https://github.com/Kludex/starlette/issues/3497
    # starlette 側が新しい参照に移行したらこの行は削除する。上限指定は不要 -- 別名が
    # 削除された場合は AttributeError になり、filterwarnings では抑止できないので
    # CI が初回実行で落ちる。
    "ignore:The anyio\\.abc\\.\\w+ alias is deprecated:DeprecationWarning",
]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.flake8]
max-line-length = 120
extend-ignore = "E203,E701"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic.mypy]
init_typed = true

[tool.isort]
profile = "black"
known_first_party = "birdxplorer_api,birdxplorer_common,birdxplorer_etl"

[tool.tox]
legacy_tox_ini = """
    [tox]
    skipsdist = true
    envlist = py310

    [testenv]
    setenv =
        VIRTUALENV_PIP = 24.0
    deps =
        -e .[dev]
        -e ../common
    commands =
        black birdxplorer_api tests
        isort birdxplorer_api tests
        pytest
        pflake8 birdxplorer_api/ tests/
        mypy birdxplorer_api --strict
        mypy tests --strict
"""
